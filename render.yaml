services:
  - type: web
    name: field-foresight-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: field-foresight-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false

databases:
  - name: field-foresight-db
    databaseName: field_foresight
    user: postgres

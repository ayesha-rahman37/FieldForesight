services:
  # ==========================================
  # FieldForesight Backend API
  # ==========================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fieldforesight_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:12345@db:5432/fieldforesight
      - FRONTEND_ORIGIN=http://localhost:5173
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=fieldforesight123
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app:ro

  # ==========================================
  # PostgreSQL Database
  # ==========================================
  db:
    image: postgres:15-alpine
    container_name: fieldforesight_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: fieldforesight
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # Neo4j Graph Database
  # ==========================================
  neo4j:
    image: neo4j:5.18-community
    container_name: fieldforesight_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/fieldforesight123
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474" # Web Browser UI
      - "7687:7687" # Bolt Protocol
    volumes:
      - neo4j_data:/data

volumes:
  postgres_data:
  neo4j_data:

